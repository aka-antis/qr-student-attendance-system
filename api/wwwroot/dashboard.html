<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Attendance QR – Admin Dashboard</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#111c2e;color:#fff;padding:14px 20px;display:flex;gap:12px;align-items:center}
main{padding:20px;max-width:1000px;margin:auto}
.card{background:#fff;border-radius:10px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.1)}
input,select,button{padding:8px 10px;margin:4px;border-radius:6px;border:1px solid #ccc}
button{background:#1a73e8;color:#fff;border:none;cursor:pointer}
button:disabled{background:#999;cursor:default}
.notice{color:#b00}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.qrcard{border:1px solid #ddd;border-radius:10px;padding:12px;text-align:center;background:#fff}
.qrcard img{width:180px;height:180px}
@media print{header,.noprint{display:none}body{background:#fff}main{max-width:none}.card{box-shadow:none}.qrcard{break-inside:avoid}}
</style>
</head>
<body>
<header><h2 style="margin:0">Attendance QR – Admin</h2><span id="who"></span></header>
<main>
<div class="card noprint">
<h3>1) Login (Admin)</h3>
<input id="base" value="http://localhost:5189" size="28" autocomplete="off"/>
<input id="user" value="admin" placeholder="username" autocomplete="username"/>
<input id="pass" value="admin123" type="password" placeholder="password" autocomplete="current-password"/>
<button onclick="login()">Login</button>
<span id="tok"></span>
</div>
<div class="card" id="studentsCard">
<h3>2) Students + QR cards</h3>
<div class="noprint">
<button onclick="loadStudents()">Load students</button>
<button onclick="printCards()">Print cards</button>
<input id="sname" placeholder="Full name" maxlength="128"/> <input id="scode" placeholder="StudentCode" maxlength="64"/>
<button onclick="addStudent()">Add student</button>
<p class="notice" id="stuErr"></p>
</div>
<div id="students" class="qr-grid"></div>
</div>
<div class="card noprint">
<h3>3) Meetings</h3>
<input id="course" placeholder="Course name" value="Math 101" maxlength="128"/>
<input id="mdate" type="date"/> <input id="mstart" type="time" value="09:00"/> <input id="mend" type="time" value="10:00"/>
<button onclick="addMeeting()">Create meeting</button>
<button onclick="loadMeetings()">Load meetings</button>
<div id="meetings"></div>
</div>
<div class="card noprint">
<h3>4) Attendance</h3>
<input id="mid" type="number" min="1" placeholder="meetingId"/>
<button onclick="loadAttendance()">View meeting attendance</button>
<button onclick="exportCsv()">Export CSV</button>
<div id="att"></div>
</div>
</main>
<script>
let JWT='';
const $=id=>document.getElementById(id);
const H=()=>({'Content-Type':'application/json',...(JWT?{'Authorization':'Bearer '+JWT}:{})});
function base(){return $('base').value.replace(/\/$/,'')}
// Escape all server/user-controlled strings before injecting into the DOM.
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function needLogin(){if(!JWT){$('stuErr').textContent='Log in as Admin first.';return true;}return false;}
async function login(){
 const r=await fetch(base()+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});
 const j=await r.json(); if(r.ok){JWT=j.token;$('tok').textContent='OK: '+j.fullName+' ('+j.role+')';$('who').textContent=j.fullName;} else alert(JSON.stringify(j));
}
function cardHtml(s,qr){
 const img=qr&&qr.qrBase64?`<img alt="QR code for ${esc(s.fullName)}" src="data:image/png;base64,${qr.qrBase64}"/>`:'<i>no QR — regenerate</i>';
 const tok=qr&&qr.token?`<br/><small style="word-break:break-all">${esc(qr.token)}</small>`:'';
 return `<div class="qrcard"><b>${esc(s.fullName)}</b><br/><small>${esc(s.studentCode)}</small><br/>${img}${tok}<br/><button class="noprint" data-regen="${s.id}">Regenerate</button></div>`;
}
async function loadStudents(){
 if(needLogin())return;
 $('stuErr').textContent='';
 const r=await fetch(base()+'/api/students',{headers:H()});
 if(r.status===403){$('stuErr').textContent='Admin role required.';return;}
 if(!r.ok){$('stuErr').textContent='Error: '+await r.text();return;}
 const list=await r.json();
 // Fetch each QR payload (token endpoint) with auth; render from Base64 (no anonymous image URL exists).
 const cards=await Promise.all(list.map(async s=>{
  const q=await fetch(base()+`/api/students/${s.id}/qr`,{headers:H()});
  return cardHtml(s,q.ok?await q.json():null);
 }));
 $('students').innerHTML=cards.join('');
 $('students').querySelectorAll('[data-regen]').forEach(b=>b.addEventListener('click',()=>regen(Number(b.dataset.regen))));
}
async function addStudent(){
 if(needLogin())return;
 const r=await fetch(base()+'/api/students',{method:'POST',headers:H(),body:JSON.stringify({fullName:$('sname').value,studentCode:$('scode').value})});
 alert(r.ok?'Added':'Error: '+await r.text()); if(r.ok)loadStudents();
}
async function regen(id){
 const r=await fetch(base()+`/api/students/${id}/regenerate`,{method:'POST',headers:H()});
 if(!r.ok)alert('Error: '+await r.text());
 loadStudents();
}
function printCards(){
 if(!document.querySelectorAll('#students .qrcard').length){
  alert('No cards to print. Click "Load students" first (and log in if needed).');
  return;
 }
 window.print();
}
async function addMeeting(){
 if(needLogin())return;
 const r=await fetch(base()+'/api/meetings',{method:'POST',headers:H(),body:JSON.stringify({courseName:$('course').value,date:$('mdate').value,startTime:$('mstart').value,endTime:$('mend').value})});
 alert(r.ok?'Created':'Error: '+await r.text()); if(r.ok)loadMeetings();
}
async function loadMeetings(){
 if(needLogin())return;
 const r=await fetch(base()+'/api/meetings',{headers:H()});
 if(!r.ok){$('meetings').textContent='Error: '+await r.text();return;}
 const j=await r.json();
 $('meetings').innerHTML=j.map(m=>`#${m.id} ${esc(m.courseName)} ${esc(m.date)} ${esc(m.startTime)}-${esc(m.endTime)} (${m.attendedCount})`).join('<br/>');
}
async function loadAttendance(){
 const id=$('mid').value;
 if(!id){$('att').textContent='Enter a meetingId first.';return;}
 const r=await fetch(base()+`/api/reports/meeting/${id}`,{headers:H()});
 const j=await r.json();
 if(!r.ok){$('att').textContent='Error: '+(j.message||JSON.stringify(j));return;}
 $('att').innerHTML=`Count: ${j.count}<br/>`+(j.rows||[]).map(x=>`${esc(x.studentName)} (${esc(x.studentCode)}) @ ${esc(x.scannedAt)}`).join('<br/>');
}
async function exportCsv(){
 const id=$('mid').value;
 if(!id){alert('Enter a meetingId first.');return;}
 // Plain links can't send the JWT, so download with an authenticated request.
 const r=await fetch(base()+`/api/reports/meeting/${id}/export.csv`,{headers:H()});
 if(!r.ok){alert('Export failed: '+await r.text());return;}
 const blob=await r.blob();
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=`meeting-${id}-attendance.csv`;
 document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
$('mdate').value=new Date().toISOString().slice(0,10);
</script>
</body>
</html>
